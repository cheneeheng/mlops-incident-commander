name: docs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mermaid:
    name: Mermaid diagrams parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm i --no-save mermaid jsdom
      - run: node scripts/check_mermaid.mjs
