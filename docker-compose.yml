services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: icc
      POSTGRES_PASSWORD: icc
      POSTGRES_DB: icc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icc -d icc"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
