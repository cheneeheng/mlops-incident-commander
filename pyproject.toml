[project]
name = "mlops-incident-commander"
version = "0.1.0"
description = "Multi-agent system that supervises a live ML model: detect, diagnose, remediate, and write postmortems."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "httpx>=0.27",
    "numpy>=2.1",
    "pillow>=11.0",
    "langgraph>=0.2.50",
    "anthropic>=0.40",
    "mcp>=1.1",
    "torch>=2.5",
    "torchvision>=0.20",
    "sentence-transformers>=3.3",
    "pgvector>=0.3.6",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "serving", "mcp_servers"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# Third-party libs without complete stubs.
[[tool.mypy.overrides]]
module = ["torch.*", "torchvision.*", "sentence_transformers.*", "pgvector.*", "mcp.*", "langgraph.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
